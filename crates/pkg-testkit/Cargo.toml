# `pkg-testkit` — the hermetic, deterministic `FakeNix` for `pkg`'s test layers.
#
# PR-3 slice 2 ships the deterministic exact-FIFO transcript replay engine
# (`plans/09` §4.4): a `FakeNix` that implements all seven `NixAdapter` methods
# and replays a scripted, first-in-first-out transcript of expectations with
# byte-stable, hermetic outputs — no Nix process, no network, no timing
# (`plans/09` §3, §4.4). Richer simulation is deferred to later checkpoints
# (`plans/09` §4.5).
#
# `pkg-testkit` depends on `pkg-nix` one way and NEVER the reverse
# (`plans/09` §4.4). The PR-36 parity harness uses pinned serde only for its
# closed, versioned golden envelope.
#
[package]
name = "pkg-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# One-way path dependency on the Nix-adapter contract: the trait, the seven
# methods' request/report types, and the closed/redacted `NixAdapterError`.
# `pkg-nix` never depends on `pkg-testkit` (plans/09 §4.4). This normal
# dependency is also what the black-box integration tests (`tests/`) use to
# name `pkg-nix` request/report fixtures directly — a normal dependency is
# available to tests, examples, and benches — so no separate
# `[dev-dependencies]` entry is needed and no reverse dependency is
# introduced.
pkg-nix = { path = "../pkg-nix" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Opt into the workspace-wide lint policy (ADR 0005).
[lints]
workspace = true
