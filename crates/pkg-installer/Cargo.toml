[package]
name = "pkg-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
listenfd = "1.0.2"
nix = { version = "0.31.3", features = ["fs", "poll", "process", "signal", "socket", "user"] }
pkg-channel = { path = "../pkg-channel" }
pkg-core = { path = "../pkg-core" }
pkg-nix = { path = "../pkg-nix" }
pkg-pipeline = { path = "../pkg-pipeline" }
pkg-store = { path = "../pkg-store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
socket2 = "=0.6.5"
rustix = { version = "=1.1.4", features = ["fs"] }
tokio = { version = "=1.53.1", features = ["net", "rt-multi-thread", "time"] }
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "=0.13.0"
pkg-macos-security = { path = "../pkg-macos-security" }
plist = "=1.10.0"

[dev-dependencies]
pkg-testkit = { path = "../pkg-testkit" }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_assignments = "deny"
dead_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[bin]]
name = "pkg-root-helper"
path = "src/bin/pkg-root-helper.rs"

[[bin]]
name = "pkg-nix-broker"
path = "src/bin/pkg-nix-broker.rs"

[[bin]]
name = "pkg-install"
path = "src/bin/pkg-install.rs"