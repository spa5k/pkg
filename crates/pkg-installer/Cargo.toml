[package]
name = "pkg-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
listenfd = "1.0.2"
nix = { version = "0.31.3", features = ["poll", "socket", "user"] }
pkg-core = { path = "../pkg-core" }
pkg-nix = { path = "../pkg-nix" }
pkg-pipeline = { path = "../pkg-pipeline" }
serde_json = "=1.0.151"
socket2 = "=0.6.5"

[dev-dependencies]
pkg-channel = { path = "../pkg-channel" }
pkg-testkit = { path = "../pkg-testkit" }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[[bin]]
name = "pkg-root-helper"
path = "src/bin/pkg-root-helper.rs"

[[bin]]
name = "pkg-nix-broker"
path = "src/bin/pkg-nix-broker.rs"
