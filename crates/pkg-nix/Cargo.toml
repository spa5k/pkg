# `pkg-nix` — the validated Nix-adapter contract for `pkg`.
#
# PR-3 slice 1 stands up the crate skeleton: the object-safe `NixAdapter` trait,
# the pkg-owned request/report domain types that compose `pkg-core` strong
# types, the closed/redacted `NixAdapterError`, and the size-capped JSON codec
# that is the single decode boundary for pkg-owned serialized reports. Raw
# version-specific Nix CLI JSON shapes are intentionally NOT modeled here yet —
# version-specific raw Nix adapters normalize into this contract later (PR-3
# slice 2 and the real adapter lane, `plans/01` §11 / `plans/09` §4.2).
#
# `pkg-core` stays serde-free; all (de)serialization in this crate goes through
# crate-private wire DTOs with explicit conversion (`plans/09` §4.2).
#
# License: intentionally ABSENT (DR-015, plans/12-open-decisions-and-risks.md).

[package]
name = "pkg-nix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Path dependency on the shared domain vocabulary. `pkg-core` is serde-free;
# this crate composes its strong types into pkg-owned request/report types and
# performs all (de)serialization through private wire DTOs itself.
pkg-core = { path = "../pkg-core" }

# Exact-pinned serde + serde_json for the size-capped JSON codec. The `derive`
# feature is used only by crate-private wire DTOs (never by public types or by
# `pkg-core`). Pinned exactly per the task contract; the lock records the exact
# transitive closure.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
