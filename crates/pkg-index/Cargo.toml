# `pkg-index` — deterministic, disposable catalog artifacts derived from a
# pinned Nixpkgs projection. The index is discovery metadata only: it never
# carries store paths, NAR hashes, or realized identity.

[package]
name = "pkg-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
brotli = "=8.0.4"
jiff = "=0.2.35"
pkg-channel = { path = "../pkg-channel" }
pkg-core = { path = "../pkg-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"

[dev-dependencies]
criterion = "=0.8.2"

[[bench]]
name = "v1"
harness = false
