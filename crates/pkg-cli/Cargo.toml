# `pkg-cli` — the standalone client over native Nix.
#
# One application crate owns parsing, configuration, the concrete Nix adapter,
# catalog routing, commands, and output (design D1). The public binary is `pkg`.
#
[package]
name = "pkg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pkg"
path = "src/main.rs"

[lib]
name = "pkg_cli"

[dependencies]
clap = { version = "=4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "=4.6.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.9.8"
# Signal forwarding for native child reaping (nix.rs cancellation handling).
libc = "=0.2.189"
# Scratch directories for temporary discovery and sync views.
tempfile = "=3.27.0"
# Local filtering for the cask catalog index lane only. The grammar is
# Rust regex, matched case-insensitively against token, name, and
# description; the Nixpkgs lane keeps passing patterns to `nix search`
# unchanged. Semantics are documented in docs/commands.md and docs/casks.md.
regex = "=1.13.1"
# Local public tap imports run through the backend library seam
# `cask_catalog::tap` (openspec/changes/import-public-cask-taps). The
# client owns consent, the tap registry, publishing, and routing; the
# library owns fetching, sandboxed Ruby, and catalog/flake generation.
cask-catalog = { path = "../../tools/cask-catalog" }

# Opt into the workspace-wide lint policy (ADR 0005).
[lints]
workspace = true
