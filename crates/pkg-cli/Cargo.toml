# `pkg-cli` — the stable, product-facing command and output contracts.
#
# PR-23 owns parsing, presentation envelopes, progress records, TTY policy, and
# exit codes. Command execution is intentionally wired later by PR-24.
#
# License: intentionally ABSENT (DR-015, plans/12-open-decisions-and-risks.md).

[package]
name = "pkg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pkg"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
clap_complete = "=4.6.9"
pkg-core = { path = "../pkg-core" }
pkg-index = { path = "../pkg-index" }
pkg-nix = { path = "../pkg-nix" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
socket2 = "=0.6.5"

[dev-dependencies]
pkg-installer = { path = "../pkg-installer" }
pkg-pipeline = { path = "../pkg-pipeline" }
pkg-testkit = { path = "../pkg-testkit" }
