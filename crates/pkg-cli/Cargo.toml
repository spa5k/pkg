# `pkg-cli` is the standalone client for native Nix.
#
# This crate handles parsing, configuration, Nix commands, catalogs, and output.
# The public binary is `pkg`.
#
[package]
name = "pkg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pkg"
path = "src/main.rs"

[lib]
name = "pkg_cli"

[dependencies]
# Keep install targets in input order and use the last display name for duplicates.
indexmap = "=2.14.2"
# Static enum names are derived at compile time; no runtime conversion.
strum_macros = "=0.28.0"
thiserror = "=2.0.21"
pkg-process = { path = "../pkg-process" }
clap = { version = "=4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "=4.6.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_path_to_error = "=0.1.20"
toml = "=1.1.8"
# Forward signals to child processes and reap them after cancellation.
libc = "=0.2.191"
# Scratch directories for temporary discovery and sync views.
tempfile = "=3.27.0"
# Shared local search filtering.
regex = "=1.13.1"
# Match name typos with optimal string alignment distance.
strsim = "=0.11.1"
# Encode paths in flake references.
percent-encoding = "=2.3.2"
# Replace directories with atomic rename operations.
rustix = { version = "=1.1.5", features = ["fs"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Read the Brotli-compressed package lists of the NixOS channels.
brotli-decompressor = "=6.1.0"
# Compare the client version with the newest published release.
semver = "=1.0.28"
# Check the release signature before a self-update replaces the client.
# rustls already builds both crates with these features.
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64 = "=0.23.1"
# Read the verified release archive in this process, not with `tar` on PATH.
flate2 = "=1.1.10"
tar = "=0.4.46"
# `cask_catalog::tap` fetches public taps, runs sandboxed Ruby, and generates
# catalogs and flakes. The client handles consent, registration, and publication.
cask-catalog = { path = "../../tools/cask-catalog" }

[lints]
workspace = true
