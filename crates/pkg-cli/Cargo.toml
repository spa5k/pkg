# `pkg-cli` — the standalone client over native Nix.
#
# One application crate owns parsing, configuration, the concrete Nix adapter,
# catalog routing, commands, and output (design D1). The public binary is `pkg`.
#
[package]
name = "pkg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pkg"
path = "src/main.rs"

[lib]
name = "pkg_cli"

[dependencies]
# One first-target-order and last-display-name owner for install batches.
indexmap = "=2.14.2"
# Static enum names are derived at compile time; no runtime conversion.
strum_macros = "=0.28.0"
thiserror = "=2.0.21"
pkg-process = { path = "../pkg-process" }
clap = { version = "=4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "=4.6.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_path_to_error = "=0.1.20"
toml = "=1.1.8"
# Signal forwarding for native child reaping (nix.rs cancellation handling).
libc = "=0.2.190"
# Scratch directories for temporary discovery and sync views.
tempfile = "=3.27.0"
# Shared local search filtering.
regex = "=1.13.1"
# The same optimal string alignment algorithm used for bounded name typos.
strsim = "=0.11.1"
# Percent encoding shared with the already locked URL parser dependency.
percent-encoding = "=2.3.2"
# Safe atomic rename operations, already used by the scratch-directory dependency.
rustix = { version = "=1.1.5", features = ["fs"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Local public tap imports run through the backend library seam
# `cask_catalog::tap` (openspec/changes/import-public-cask-taps). The
# client owns consent, the tap registry, publishing, and routing; the
# library owns fetching, sandboxed Ruby, and catalog/flake generation.
cask-catalog = { path = "../../tools/cask-catalog" }

# Opt into the workspace lint policy.
[lints]
workspace = true
