# `pkg-cli` — the standalone client over native Nix.
#
# One application crate owns parsing, configuration, the concrete Nix adapter,
# catalog routing, commands, and output (design D1). The public binary is `pkg`.
#
[package]
name = "pkg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pkg"
path = "src/main.rs"

[lib]
name = "pkg_cli"

[dependencies]
clap = { version = "=4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "=4.6.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.9.8"
# Signal forwarding for native child reaping (nix.rs cancellation handling).
libc = "=0.2.189"
# Scratch directories for temporary discovery and sync views.
tempfile = "=3.27.0"

# Opt into the workspace-wide lint policy (ADR 0005).
[lints]
workspace = true
