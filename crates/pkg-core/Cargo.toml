# `pkg-core` — shared domain vocabulary crate for `pkg`.
#
# PR-2 fills in the domain modules (identity, selector, realization, channel,
# version, system) that the rest of `pkg` builds on. PR-1 stood up the scaffold
# (this manifest plus an empty `lib.rs`); this PR extends it with the domain
# types/logic/tests. PR-10 adds strict JSON wire DTOs for persisted state while
# keeping serialization traits off the existing domain vocabulary.
#
[package]
name = "pkg-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Exact versions match the already-audited pkg-nix wire boundary. Persisted
# state uses private DTOs plus validating conversions into strong domain types.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

# The injected wall-clock seam returns jiff's `Timestamp`, the same strict
# civil-time type the channel freshness boundary already parses. Version
# pinned exactly to match the other workspace consumers.
jiff = "=0.2.35"

[dev-dependencies]
# Property-based testing for the roadmap-required proptests (doc 09 §6.1,
# layer 1). Pinned exactly and kept `std`-only (no fork/timeout/bit-set) to
# minimize the transitive dependency surface. Current as of this PR, licensed
# "MIT OR Apache-2.0" — within the `deny.toml` dependency allowlist.
#
# MSRV note: `proptest` 1.11.0 declares an MSRV of 1.85, while the workspace
# MSRV is 1.96 (rust-toolchain.toml). This crate's own code targets the
# workspace toolchain; the dependency's lower declared MSRV does not lower the
# workspace floor.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

# Opt into the workspace-wide lint policy (ADR 0005).
[lints]
workspace = true
