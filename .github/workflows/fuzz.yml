# Fuzz — run each cargo-fuzz target in fuzz/ every night.
#
# Each target keeps its corpus in the Actions cache, so each night starts
# from the inputs of the night before. A crash fails the job and uploads the
# input that caused it. A pull request that changes fuzz/ runs each target
# for one minute only, to check that the targets build and start.

name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - fuzz/**
      - .github/workflows/fuzz.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - release_signature
          - release_sums
          - release_archive
          - channel_list
          - catalog_id
          - path_reference
          - tap_archive
          - tap_export
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || '1200' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust and cargo-fuzz (0.13.2, locked)
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz@0.13.2

      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        working-directory: fuzz
        run: |
          mkdir -p "corpus/$TARGET"
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" \
            "corpus/$TARGET" "seeds/$TARGET" -- -max_total_time="$SECONDS_PER_TARGET"

      # Only scheduled and manual runs save the corpus. A pull request must
      # not change the corpus that the nightly run uses.
      - name: Save the corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload the crash input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
