# PR-31 nightly hardening lane. PR-36 extends this workflow with the
# authenticated Real-Nix connector/platform matrix; until then this workflow
# deliberately names only the hermetic security and fault evidence it proves.

name: nightly-hardening

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-hardening
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.96.1"
  CARGO_TERM_COLOR: always

jobs:
  security:
    uses: ./.github/workflows/security.yml

  fault-harness:
    name: G-FAULT harness (${{ matrix.os }})
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Fetch workspace dependencies before offline fault execution
        run: cargo fetch --locked

      - name: Run deterministic process and HTTP fault harnesses
        run: |
          cargo test --offline --locked -p pkg-testkit chaos::tests
          cargo test --offline --locked -p pkg-testkit http::tests

      - name: Run nightly ignored fault cases
        run: cargo test --offline --locked --workspace --all-features -- --ignored
