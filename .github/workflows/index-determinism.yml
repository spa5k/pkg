# T-IDX-3: both native host families must reproduce the committed tiny-slice
# digest. Matching the same exact-byte digest proves their output bytes match.
name: index-determinism

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.96.1"
  CARGO_TERM_COLOR: always

jobs:
  deterministic-index:
    name: deterministic index (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Reproduce canonical fixture bytes
        run: cargo test --locked -p pkg-index --test determinism tiny_slice_has_cross_host_stable_bytes -- --exact
