# Hermetic security lane for plans/09 AC-S1..S10.

name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.96.1"
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: G-SECURITY (AC-S1..S10, no egress)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install and verify pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
          test "$channel" = "$RUSTUP_TOOLCHAIN"
          rustup toolchain install "$channel" --profile minimal
          rustc --version
          cargo --version

      - name: Install pinned dependency security tools
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked cargo-audit@0.22.2

      - name: Fetch every hermetic lane dependency before egress closes
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path spikes/s2-tough/Cargo.toml

      - name: AC-S8 dependency policy and RustSec audit
        run: |
          cargo deny --locked check
          cargo audit

      - name: Disable external IPv4 and IPv6 egress
        shell: bash
        run: |
          set -euo pipefail
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A OUTPUT -j REJECT
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -A OUTPUT -j REJECT

      - name: Validate the closed lane manifest and runner
        run: |
          python3 -m unittest discover -s tests/security -p 'test_*.py' -v
          python3 tests/security/run.py --validate-only

      - name: Exercise chaos and loopback HTTP fault primitives
        run: cargo test --offline --locked -p pkg-testkit

      - name: Run AC-S1 through AC-S10
        env:
          PKG_SECURITY_EXTERNAL_GATES: passed
        run: python3 tests/security/run.py
