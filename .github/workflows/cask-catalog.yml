# Cask catalog regeneration check.
#
# Regenerates catalog.json from the committed pin and the pinned snapshot
# bytes and fails when the committed catalog differs by a single byte.
# This is the published-state twin of the generator's integrity checks:
# tampered or stale data cannot ship.

name: cask-catalog

on:
  pull_request:
    paths:
      - "tools/cask-catalog/**"
      - "nix/casks/**"
      - "tools/cask-build-check/**"
      - ".github/workflows/cask-catalog.yml"
  push:
    branches: [main]
    paths:
      - "tools/cask-catalog/**"
      - "nix/casks/**"
      - "tools/cask-build-check/**"
      - ".github/workflows/cask-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  regenerate:
    name: regenerate and compare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Fetch helpers safety tests (offline, fail fast)
        run: python3 -m unittest discover -s tools/cask-catalog/tests -p test_safe_fetch.py -v

      - name: Homebrew API signature tests
        run: cargo test --locked -p cask-catalog --lib homebrew_api

      - name: Fetch the pinned snapshot
        run: |
          set -eu
          sha="$(python3 -c 'import json;print(json.load(open("nix/casks/catalog/input.json"))["sha256"])')"
          url="$(python3 -c 'import json;print(json.load(open("nix/casks/catalog/input.json"))["url"])')"
          test "$url" = "https://github.com/spa5k/pkg/releases/download/catalog-inputs/cask-$sha.json.gz"
          # `fetch` checks the bytes and rewrites the same pin.
          cargo run --locked -p cask-catalog -- fetch --url "$url" --sha256 "$sha"

      - name: Regenerate the catalog from the pin
        run: cargo run --locked -p cask-catalog -- generate --out-dir nix/casks/catalog

      - name: Compare with the committed catalog
        run: |
          set -eu
          git diff --exit-code -- nix/casks/catalog/catalog.json nix/casks/catalog/input.json

      - name: Generator tests
        run: cargo test --locked -p cask-catalog

      - name: Install Nix for archive and builder checks
        uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1

      - name: Archive boundary checks
        run: |
          nix shell github:NixOS/nixpkgs/8edc0c72e3a38faf5434e40d1f19431125fe4b30#libarchive \
            github:NixOS/nixpkgs/8edc0c72e3a38faf5434e40d1f19431125fe4b30#_7zz \
            --command python3 tools/cask-build-check/plan_tests.py

      - name: Native cask builder checks
        run: bash tools/cask-build-check/run.sh
