name: Alpha release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Build signed draft assets or deploy the signed channel
        type: choice
        options: [build, deploy]
        required: true
      sha256:
        description: SHA-256 of 1.root.json (build) or channel.tar.gz (deploy)
        type: string
        required: true

permissions: {}

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  build:
    if: inputs.phase == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            system: aarch64-darwin
            arch: arm64
          - runner: ubuntu-22.04
            system: x86_64-linux
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
      SYSTEM: ${{ matrix.system }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      PKG_RELEASE_CHANNEL_METADATA_URL: https://spa5k.github.io/pkg/alpha/metadata/
      PKG_RELEASE_CHANNEL_TARGETS_URL: https://spa5k.github.io/pkg/alpha/targets/
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Build and sign the exact tagged source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_REPOSITORY" = spa5k/pkg
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release download "$GITHUB_REF_NAME" --pattern 1.root.json
          printf '%s  1.root.json\n' "$EXPECTED_SHA256" | shasum -a 256 --check
          export PKG_RELEASE_TUF_ROOT_JSON="$(cat 1.root.json)"
          rustup toolchain install 1.96.1 --profile minimal
          cargo build --locked --release -p pkg-cli --bin pkg \
            -p pkg-installer --bin pkg-install --bin pkg-nix-broker --bin pkg-root-helper
          test "$(target/release/pkg --version)" = "pkg ${GITHUB_REF_NAME#v}"
          mkdir assets
          for binary in pkg pkg-nix-broker pkg-root-helper pkg-install; do
            cp "target/release/$binary" "assets/$binary-$SYSTEM"
          done
          if [[ "$SYSTEM" == aarch64-darwin ]]; then
            for binary in assets/*; do
              codesign --force --sign - --options runtime --timestamp=none "$binary"
              codesign --verify --strict "$binary"
            done
            packaging/macos/build-preview.sh "$PWD/assets/pkg-install-$SYSTEM" \
              "$PWD/assets/pkg-${GITHUB_REF_NAME#v}-preview.pkg" "${GITHUB_REF_NAME#v}"
            cp packaging/macos/install-preview.sh assets/install-preview.sh
          fi
          for artifact in assets/*; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
            cosign verify-blob --bundle "$artifact.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/alpha-release.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$artifact"
          done
          gh release upload "$GITHUB_REF_NAME" assets/*

  deploy:
    if: inputs.phase == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - name: Stage the exact signed alpha channel
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_REPOSITORY" = spa5k/pkg
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern channel.tar.gz
          printf '%s  channel.tar.gz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
          mkdir -p site/alpha
          tar -xzf channel.tar.gz -C site/alpha --no-same-owner
          test -f site/alpha/metadata/timestamp.json
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
