# PR-32 G-PERF. Runner-specific baselines are deliberately evaluated only on
# the fixed native reference host that produced them; heterogeneous hosted
# runners and QEMU results are not comparable release evidence.

name: performance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.96.1"
  CARGO_TERM_COLOR: always

jobs:
  native-arm64:
    name: G-PERF (native arm64 reference)
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, pkg-perf-reference, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: main

      - name: Verify pinned native toolchain and host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          channel="$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
          test "$channel" = "$RUSTUP_TOOLCHAIN"
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Run macOS arm64 benchmark and gate
        # `runner` is available only after job assignment, so bind the actual
        # selected host identity at step scope.
        env:
          PKG_PERF_RUNNER: ${{ runner.name }}
        run: |
          cargo bench --locked -p pkg-index --bench v1 -- --noplot
          python3 benches/check.py \
            --platform aarch64-darwin \
            --runner "$PKG_PERF_RUNNER"

      - name: Run Linux arm64 benchmark in pinned container and gate
        shell: bash
        env:
          PKG_PERF_RUNNER: ${{ runner.name }}
        run: |
          set -euo pipefail
          output="$(mktemp -d)"
          trap 'rm -rf "$output"' EXIT
          docker run --rm --platform linux/arm64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --mount "type=bind,src=$output,dst=/bench-output" \
            --workdir /workspace \
            --env CARGO_TARGET_DIR=/bench-output \
            rust@sha256:1f0dbad1df66647807e6952d1db85d0b2bda7606cb2139d82517e4f009967376 \
            bash -c 'test "$(uname -m)" = aarch64 && cargo bench --locked -p pkg-index --bench v1 -- --noplot'
          python3 benches/check.py \
            --platform aarch64-linux \
            --runner "$PKG_PERF_RUNNER" \
            --criterion-dir "$output/criterion"

      - name: Test the closed budget-gate contract
        run: python3 -m unittest discover -s benches -p 'test_*.py' -v
