name: macOS Apple Silicon lifecycle proof

on:
  workflow_dispatch:
    inputs:
      destructive_confirmation:
        description: Type DESTROY-PKG-DISPOSABLE-MACOS
        required: true
        type: string
      production_environment:
        description: This runner is a production machine
        required: true
        type: boolean
        default: true
      from_release:
        description: Signed release tag for lifecycle N
        required: true
        type: string
      to_release:
        description: Signed release tag for lifecycle N+1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-disposable-lifecycle-proof
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: "1.96.1"
  CARGO_TERM_COLOR: always
  PKG_REVIEWED_COMMIT: 8ffd325a4be12a998f3a5684097b57841a11540e
  PKG_DETERMINATE_SHA256: 90cb96f597530553eef1311b37124d1e895fdb3a19877e65a4572dda7753f50b
  PKG_PROOF_CONFIRMATION: ${{ inputs.destructive_confirmation }}
  PKG_PROOF_PRODUCTION: ${{ inputs.production_environment }}

jobs:
  harness:
    name: Build proof-only fault harness
    if: >-
      inputs.destructive_confirmation == 'DESTROY-PKG-DISPOSABLE-MACOS' &&
      inputs.production_environment == false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout the proof harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: proof-source
          persist-credentials: false

      - name: Checkout the reviewed production source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PKG_REVIEWED_COMMIT }}
          path: reviewed-source
          persist-credentials: false

      - name: Build the proof-only test executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git -C proof-source rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest proof-source/tests/macos-clean-host/test_workflow.py
          bash -n proof-source/tests/macos-clean-host/prove.sh
          cd reviewed-source
          test "$(git rev-parse HEAD)" = "$PKG_REVIEWED_COMMIT"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo test --locked --release -p pkg-installer --lib --no-run
          test_bin=$(find target/release/deps -type f -perm -111 \
            -name 'pkg_installer-*' ! -name '*.dSYM' -print | head -n 1)
          test -n "$test_bin"
          out="$RUNNER_TEMP/pkg-macos-proof-harness"
          install -d -m 0700 "$out"
          install -m 0755 "$test_bin" "$out/pkg-installer-tests"
          install -m 0755 ../proof-source/tests/macos-clean-host/prove.sh "$out/prove.sh"
          install -m 0644 ../proof-source/tests/macos-clean-host/README.md "$out/README.md"
          (
            cd "$out"
            find . -type f -print | LC_ALL=C sort > INVENTORY
            shasum -a 256 pkg-installer-tests prove.sh README.md > SHA256SUMS
          )

      - name: Upload proof-only harness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pkg-macos-proof-harness
          path: ${{ runner.temp }}/pkg-macos-proof-harness
          if-no-files-found: error
          retention-days: 3

  prove:
    name: Destructive native lifecycle proof
    needs: harness
    if: >-
      inputs.destructive_confirmation == 'DESTROY-PKG-DISPOSABLE-MACOS' &&
      inputs.production_environment == false
    runs-on: [self-hosted, macOS, ARM64, "${{ matrix.runner_label }}"]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The trusted provisioner must map these names to two different VMs.
        # It must never reassign both names to one VM or one reimage nonce.
        # Before the runner starts, it must reboot once and write the exact
        # root:wheel 0600 V2 reboot record checked below.
        include:
          - lifecycle_run: 1
            runner_label: pkg-disposable-macos-proof-1
            runner_name: pkg-dn16-proof-runner-1
          - lifecycle_run: 2
            runner_label: pkg-disposable-macos-proof-2
            runner_name: pkg-dn16-proof-runner-2
    steps:
      - name: Initialize bounded preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/pkg-macos-proof/evidence"
          printf '%s\n' \
            "lifecycle_run=${{ matrix.lifecycle_run }}" \
            "expected_runner=${{ matrix.runner_name }}" \
            "status=preflight-incomplete" \
            > "$RUNNER_TEMP/pkg-macos-proof/evidence/preflight.txt"
          printf '%s\n' \
            "lifecycle_run=${{ matrix.lifecycle_run }}" \
            "status=incomplete" \
            "candidate=unresolved" \
            > "$RUNNER_TEMP/pkg-macos-proof/evidence/result.txt"

      - name: Refuse an unsafe host before download or mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$PKG_PROOF_CONFIRMATION" = DESTROY-PKG-DISPOSABLE-MACOS
          test "$PKG_PROOF_PRODUCTION" = false
          test "${RUNNER_ENVIRONMENT:-}" = self-hosted
          test "$RUNNER_NAME" = "${{ matrix.runner_name }}"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sysctl -n kern.hv_vmm_present)" = 1
          case "$(sysctl -n hw.model)" in VirtualMac*) ;; *) exit 1 ;; esac
          test -f /var/tmp/pkg-disposable-macos-proof
          test ! -L /var/tmp/pkg-disposable-macos-proof
          test "$(stat -f '%Su:%Sg:%Lp' /var/tmp/pkg-disposable-macos-proof)" = root:wheel:600
          test "$(stat -f '%z' /var/tmp/pkg-disposable-macos-proof)" -le 128
          test "$(cat /var/tmp/pkg-disposable-macos-proof)" = \
            "PKG-DN16-DISPOSABLE-V1:${GITHUB_RUN_ID}:${{ matrix.lifecycle_run }}"
          marker_age=$(( $(date +%s) - $(stat -f '%m' /var/tmp/pkg-disposable-macos-proof) ))
          test "$marker_age" -ge 0
          test "$marker_age" -le 300
          instance_marker=/var/tmp/pkg-disposable-macos-instance
          test -f "$instance_marker"
          test ! -L "$instance_marker"
          test "$(stat -f '%Su:%Sg:%Lp' "$instance_marker")" = root:wheel:600
          test "$(stat -f '%z' "$instance_marker")" -le 128
          instance_record=$(cat "$instance_marker")
          [[ "$instance_record" =~ ^PKG-DN16-INSTANCE-V1:([0-9a-f]{64})$ ]]
          instance_nonce=${BASH_REMATCH[1]}
          instance_age=$(( $(date +%s) - $(stat -f '%m' "$instance_marker") ))
          test "$instance_age" -ge 0
          test "$instance_age" -le 300
          reboot_marker=/var/tmp/pkg-disposable-macos-reboot-v2
          test -f "$reboot_marker"
          test ! -L "$reboot_marker"
          test "$(stat -f '%Su:%Sg:%Lp' "$reboot_marker")" = root:wheel:600
          test "$(stat -f '%z' "$reboot_marker")" -le 256
          test "$(wc -l < "$reboot_marker")" -eq 1
          reboot_record=$(cat "$reboot_marker")
          reboot_prefix="PKG-DN16-REBOOT-V2:${GITHUB_RUN_ID}:${{ matrix.lifecycle_run }}:${RUNNER_NAME}:${instance_nonce}:"
          [[ "$reboot_record" =~ ^${reboot_prefix}([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}):([0-9]{10})$ ]]
          prior_boot=${BASH_REMATCH[1]}
          reboot_timestamp=${BASH_REMATCH[2]}
          current_boot=$(sysctl -n kern.bootsessionuuid)
          test "$prior_boot" != "$current_boot"
          reboot_age=$(( $(date +%s) - reboot_timestamp ))
          test "$reboot_age" -ge 0
          test "$reboot_age" -le 300
          reboot_marker_age=$(( $(date +%s) - $(stat -f '%m' "$reboot_marker") ))
          test "$reboot_marker_age" -ge 0
          test "$reboot_marker_age" -le 300
          sudo -n true
          launchd_labels="$RUNNER_TEMP/pkg-macos-proof/launchd-labels.txt"
          (ulimit -f 2048; sudo -n launchctl list) > "$launchd_labels"
          test "$(stat -f '%z' "$launchd_labels")" -le 1048576
          awk 'NR > 1 {
            label=tolower($3)
            if (label ~ /nix.*daemon/ || label ~ /daemon.*nix/) found=1
          } END { exit found ? 1 : 0 }' "$launchd_labels"
          for path in /nix /etc/nix /opt/pkg /private/var/db/pkg-install \
            /private/var/db/pkg-install-journal /private/var/db/pkg-install-auth \
            /Library/LaunchDaemons/org.pkg.root-helper.plist \
            /Library/LaunchDaemons/org.pkg.nix-broker.plist \
            /Library/LaunchDaemons/org.nixos.nix-daemon.plist \
            /Library/LaunchDaemons/systems.determinate.nix-daemon.plist; do
            test ! -e "$path" && test ! -L "$path"
          done
          users="$RUNNER_TEMP/pkg-macos-proof/users.txt"
          groups="$RUNNER_TEMP/pkg-macos-proof/groups.txt"
          (ulimit -f 128; dscl . -list /Users) > "$users"
          (ulimit -f 128; dscl . -list /Groups) > "$groups"
          test "$(stat -f '%z' "$users")" -le 65536
          test "$(stat -f '%z' "$groups")" -le 65536
          if grep -Eq '^(_?nixbld([0-9]+)?|_?pkg-nix-broker)$' "$users"; then
            exit 1
          else
            test "$?" -eq 1
          fi
          if grep -Eq '^(_?nixbld|_?pkg-nix-broker)$' "$groups"; then
            exit 1
          else
            test "$?" -eq 1
          fi
          for file in /private/etc/synthetic.conf /private/etc/fstab; do
            test ! -e "$file" || test -f "$file"
            test ! -L "$file"
            test ! -e "$file" || test -r "$file"
          done
          if test -f /private/etc/synthetic.conf; then
            awk '!/^[[:space:]]*#/ && $1 == "nix" { found=1 } END { exit found ? 1 : 0 }' \
              /private/etc/synthetic.conf
          fi
          if test -f /private/etc/fstab; then
            awk '!/^[[:space:]]*#/ { for (i=1; i<=NF; i++) if ($i == "/nix") found=1 } \
              END { exit found ? 1 : 0 }' /private/etc/fstab
          fi
          shopt -s nullglob
          for path in /Library/LaunchDaemons/* /Library/LaunchAgents/*; do
            name=$(basename "$path" | tr '[:upper:]' '[:lower:]')
            case "$name" in
              *org.nixos.*|*determinate*nix*|*nix*daemon*|nix-*|nix.*|_nixbld*) exit 1 ;;
            esac
          done
          require_unloaded() {
            set +e
            launchctl print "system/$1" >/dev/null 2>&1
            status=$?
            set -e
            test "$status" -eq 113
          }
          for label in org.nixos.nix-daemon systems.determinate.nix-daemon \
            org.nixos.darwin-store systems.determinate.nix-store org.pkg.nix-daemon; do
            require_unloaded "$label"
          done
          for home in /private/var/root /Users/*; do
            for name in .nix-profile .nix-defexpr .nix-channels; do
              test ! -e "$home/$name" && test ! -L "$home/$name"
            done
          done
          for directory in /bin /usr/bin /usr/local/bin /opt/homebrew/bin; do
            for name in nix nix-daemon nix-store nix-env nix-build; do
              test ! -e "$directory/$name" && test ! -L "$directory/$name"
            done
          done
          for name in nix nix-daemon nix-store nix-env nix-build; do
            ! command -v "$name" >/dev/null 2>&1
          done
          require_unloaded org.pkg.root-helper
          require_unloaded org.pkg.nix-broker
          command -v gh >/dev/null
          command -v cosign >/dev/null
          command -v python3 >/dev/null
          printf '%s\n' \
            "lifecycle_run=${{ matrix.lifecycle_run }}" \
            "runner_name=$RUNNER_NAME" \
            "instance_nonce=$instance_nonce" \
            "status=preflight-passed" \
            > "$RUNNER_TEMP/pkg-macos-proof/evidence/preflight.txt"

      - name: Download proof-only harness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pkg-macos-proof-harness
          path: ${{ runner.temp }}/pkg-macos-proof/harness

      - name: Verify the harness inventory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pkg-macos-proof/harness"
          printf '%s\n' ./README.md ./pkg-installer-tests ./prove.sh | LC_ALL=C sort > EXPECTED
          cmp EXPECTED INVENTORY
          shasum -a 256 --check SHA256SUMS

      - name: Download and authenticate signed release inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RELEASE: ${{ inputs.from_release }}
          TO_RELEASE: ${{ inputs.to_release }}
        run: |
          set -euo pipefail
          [[ "$FROM_RELEASE" =~ ^v0\.1\.0-alpha\.[1-9][0-9]*$ ]]
          [[ "$TO_RELEASE" =~ ^v0\.1\.0-alpha\.[1-9][0-9]*$ ]]
          from_sequence=${FROM_RELEASE##*.}
          to_sequence=${TO_RELEASE##*.}
          test "$from_sequence" -lt "$to_sequence"
          root="$RUNNER_TEMP/pkg-macos-proof"
          from_source_commit=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$FROM_RELEASE" --jq .sha)
          to_source_commit=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$TO_RELEASE" --jq .sha)
          [[ "$from_source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$to_source_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$from_source_commit" = "$PKG_REVIEWED_COMMIT"
          test "$to_source_commit" = "$PKG_REVIEWED_COMMIT"
          printf '%s\n' "$from_source_commit" > "$root/evidence/from-source-commit.txt"
          printf '%s\n' "$to_source_commit" > "$root/evidence/to-source-commit.txt"
          install -d -m 0700 "$root/candidate/from" "$root/candidate/to" "$root/evidence"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml@refs/heads/main"
          issuer=https://token.actions.githubusercontent.com
          for pair in "from:$FROM_RELEASE" "to:$TO_RELEASE"; do
            side=${pair%%:*}
            tag=${pair#*:}
            version=${tag#v}
            dir="$root/candidate/$side"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
              --jq 'select(.isDraft == true or .isPrerelease == true) | true' | grep -Fx true >/dev/null
            for asset in SHA256SUMS SHA256SUMS.sigstore.json \
              release-manifest.json COSIGN_IDENTITY.txt COSIGN_ISSUER.txt \
              "pkg-$version-preview.pkg" "pkg-$version-preview.pkg.sigstore.json" \
              pkg-aarch64-darwin pkg-aarch64-darwin.sigstore.json; do
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$dir"
            done
            cosign verify-blob --bundle "$dir/SHA256SUMS.sigstore.json" \
              --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
              "$dir/SHA256SUMS" >/dev/null
            awk '$2 == "SHA256SUMS" || $2 == "SHA256SUMS.sigstore.json" { found=1 } \
              END { exit found ? 1 : 0 }' "$dir/SHA256SUMS"
            test "$(cat "$dir/COSIGN_IDENTITY.txt")" = "$identity"
            test "$(cat "$dir/COSIGN_ISSUER.txt")" = "$issuer"
            selected="$root/evidence/$side-selected-sha256.txt"
            : > "$selected"
            for asset in "pkg-$version-preview.pkg" pkg-aarch64-darwin release-manifest.json; do
              awk -v a="$asset" '$2 == a { n++; print } END { exit n != 1 }' \
                "$dir/SHA256SUMS" >> "$selected"
            done
            (cd "$dir" && shasum -a 256 --check "$selected")
            python3 - "$dir/release-manifest.json" "$tag" <<'PY'
          import json
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          if manifest.get("releaseId") != sys.argv[2]:
              raise SystemExit("release manifest does not match selected tag")
          PY
            for asset in "pkg-$version-preview.pkg" pkg-aarch64-darwin; do
              cosign verify-blob --bundle "$dir/$asset.sigstore.json" \
                --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
                "$dir/$asset" >/dev/null
            done
          done
          find "$root/candidate" -type f -print | LC_ALL=C sort > "$root/evidence/candidate-inventory.txt"
          find "$root/candidate" -type f -exec shasum -a 256 {} \; \
            | LC_ALL=C sort > "$root/evidence/candidate-digests.txt"

      - name: Run the destructive proof
        shell: bash
        env:
          PKG_PROOF_FROM_RELEASE: ${{ inputs.from_release }}
          PKG_PROOF_TO_RELEASE: ${{ inputs.to_release }}
          PKG_PROOF_ROOT: ${{ runner.temp }}/pkg-macos-proof
          PKG_PROOF_REBOOT_MARKER: /var/tmp/pkg-disposable-macos-reboot-v2
          PKG_PROOF_LIFECYCLE_RUN: ${{ matrix.lifecycle_run }}
        run: ${{ runner.temp }}/pkg-macos-proof/harness/prove.sh

      - name: Upload bounded proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pkg-macos-lifecycle-evidence-${{ matrix.lifecycle_run }}
          path: ${{ runner.temp }}/pkg-macos-proof/evidence
          if-no-files-found: error
          retention-days: 3

      - name: Retain authenticated candidates after success
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pkg-macos-authenticated-candidates-${{ matrix.lifecycle_run }}
          path: ${{ runner.temp }}/pkg-macos-proof/candidate
          if-no-files-found: error
          retention-days: 3

  aggregate:
    name: Verify independent proof runners
    needs: prove
    if: ${{ always() && needs.prove.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download both bounded evidence artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: pkg-macos-lifecycle-evidence-*
          path: ${{ runner.temp }}/pkg-macos-proof-results

      - name: Verify distinct runner and reimage identities
        shell: bash
        env:
          PROVE_RESULT: ${{ needs.prove.result }}
        run: |
          set -euo pipefail
          test "$PROVE_RESULT" = success
          python3 - "$RUNNER_TEMP/pkg-macos-proof-results" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          expected = {
              1: "pkg-dn16-proof-runner-1",
              2: "pkg-dn16-proof-runner-2",
          }
          observed = []
          if {path.name for path in root.iterdir()} != {
              "pkg-macos-lifecycle-evidence-1",
              "pkg-macos-lifecycle-evidence-2",
          }:
              raise SystemExit("the exact two evidence artifacts are required")
          for run, runner in expected.items():
              path = root / f"pkg-macos-lifecycle-evidence-{run}" / "preflight.txt"
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 1024:
                  raise SystemExit("preflight evidence is absent or unsafe")
              records = {}
              for line in path.read_text(encoding="utf-8").splitlines():
                  key, separator, value = line.partition("=")
                  if separator != "=" or key in records:
                      raise SystemExit("preflight evidence is malformed")
                  records[key] = value
              if records != {
                  "lifecycle_run": str(run),
                  "runner_name": runner,
                  "instance_nonce": records.get("instance_nonce", ""),
                  "status": "preflight-passed",
              }:
                  raise SystemExit("preflight evidence does not match its slot")
              nonce = records["instance_nonce"]
              if re.fullmatch(r"[0-9a-f]{64}", nonce) is None:
                  raise SystemExit("the reimage nonce is invalid")
              observed.append((runner, nonce))
          if len({runner for runner, _ in observed}) != 2:
              raise SystemExit("runner names are not distinct")
          if len({nonce for _, nonce in observed}) != 2:
              raise SystemExit("reimage nonces are not distinct")
          print("independent proof runner evidence passed")
          PY
