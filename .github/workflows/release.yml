# PR-33 release assurance. This workflow executes only test-key dry runs. Real
# online signing keys remain in the selected KMS/HSM provider and are supplied
# through pkg-release's KeySource boundary by the deployment, never as GitHub
# secrets or repository files.

name: release-assurance

on:
  pull_request:
    paths:
      - "tools/release/**"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-assurance-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.96.1"
  CARGO_TERM_COLOR: always

jobs:
  dry-run-sign:
    name: test-key TUF sign, verify, publish transaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install and verify pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -nE 's/^channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
          test "$channel" = "$RUSTUP_TOOLCHAIN"
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Run isolated release dry run
        run: cargo test --locked -p pkg-release

      - name: Assert no reusable private key was committed
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E --exclude='release.yml' \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' tools/release; then
            echo "::error::private key material found in release tooling" >&2
            exit 1
          fi
