# CI — ordinary Rust checks plus a small native smoke path.
#
# NN-07/NN-08: the old ambient-time audits, quality ratchets, index
# determinism, proof-repeat, and machine install matrices are deleted with
# their subjects. What remains: build, test, format, clippy, docs, dependency
# checks on the pinned toolchain, and one smoke job that runs the built
# client without any pkg service or privileged helper.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Overrides any ambient RUSTUP_TOOLCHAIN so the pinned channel in
  # rust-toolchain.toml is what actually compiles.
  RUSTUP_TOOLCHAIN: "1.96.1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: build / test / fmt / clippy / docs / deny
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, so rustup does not
      # auto-install the file's components; fmt and clippy must be explicit.
      - name: Install pinned Rust toolchain (fmt + clippy components)
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Build (all targets, locked)
        run: cargo build --locked --all-targets

      - name: Test (locked)
        run: cargo test --locked

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Docs (warnings deny)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items

      - name: Install cargo-deny (0.20.2, locked)
        run: cargo install --locked cargo-deny@0.20.2

      # The build and test steps above only download crates for the Linux
      # target, but cargo-deny resolves the dependency graph for every
      # target. Windows-only crates such as windows-sys and anstyle-wincon
      # were therefore absent from the local registry, and the offline
      # policy check below failed by trying to fetch them. cargo fetch
      # downloads the complete all-target crate set first.
      - name: Fetch all-target dependencies (locked)
        run: cargo fetch --locked

      # cargo-deny 0.20.2 has no --disable-fetch flag; the cold-safe form is
      # the root-level --offline, which forbids fetching crates, advisory
      # databases, and std-replacement data. The check set excludes
      # advisories, so no advisory database is needed. bans/licenses/sources
      # read the local cargo registry populated by the fetch step above.
      - name: Dependency policy (cargo-deny)
        run: cargo deny --locked --offline check bans licenses sources

  smoke:
    name: client smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, so rustup does not
      # auto-install the file's components. The Linux `rust` job already
      # lints; the macOS Clippy step below needs the component, so only
      # that matrix leg installs it.
      - name: Install pinned Rust toolchain (clippy on macOS)
        run: |
          components=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            components="--component clippy"
          fi
          # shellcheck disable=SC2086 -- intentional word splitting of an empty-or-flag list
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal $components

      # The `rust` job lints on Linux only, so cfg(target_os = "macos")
      # code (APFS cloning, launcher sync) is never linted there. Lint
      # the same all-targets set on macOS so that code is checked too.
      - name: Clippy (all targets, deny warnings)
        if: matrix.os == 'macos-15'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release client
        run: cargo build --locked --release -p pkg-cli

      # Installer checks run after the build so a broken install.sh is
      # caught in CI, not on a user machine. sh -n is a pure POSIX syntax
      # check; ShellCheck adds the semantic pass CONTRIBUTING requires;
      # the unittest suite runs the real script against fake downloads in
      # temporary homes. Tests that need Linux-only isolation (unshare)
      # skip themselves on macOS.
      - name: Installer script syntax check
        run: sh -n install.sh

      # Use the runner's ShellCheck if present; install it when missing.
      - name: Installer shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "ShellCheck missing from the runner image; installing it"
            if [ "${{ runner.os }}" = "macOS" ]; then
              brew install shellcheck
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq shellcheck
            fi
          fi
          shellcheck --version | sed -n '2p'
          shellcheck install.sh

      - name: Installer unit tests
        run: python3 -m unittest discover -s docs/tests -v

      - name: Run the client without services or helpers
        run: |
          set -eu
          bin="target/release/pkg"
          test -x "$bin"
          "$bin" --version
          "$bin" --help >/dev/null
          "$bin" completion bash >/dev/null
          "$bin" completion zsh >/dev/null
          # doctor must run read-only and must not start an installer.
          # Without an external Nix it reports the missing runtime and
          # returns a nonzero status; accept exactly that outcome.
          if command -v nix >/dev/null 2>&1; then
            "$bin" doctor
          else
            if "$bin" doctor >/dev/null 2>&1; then
              echo "doctor unexpectedly succeeded without Nix" >&2
              exit 1
            fi
          fi

      - name: Install Nix for native lifecycle checks
        uses: DeterminateSystems/determinate-nix-action@668647a33843b1f280cb2ef4c41736f86b29f826 # v3.22.1

      - name: macOS archive and external-signature checks
        if: matrix.os == 'macos-15'
        run: >-
          nix shell
          github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f#python3
          github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f#_7zz
          github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f#libarchive
          --command python3 tools/cask-build-check/plan_tests.py

      - name: Native package lifecycle and regression checks
        run: python3 tools/native-cli-check.py --pkg target/release/pkg
