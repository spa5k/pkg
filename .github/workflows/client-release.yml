# Client release — one archive per supported target (NN-08).
#
# Builds the standalone `pkg` client for x86_64 Linux and Apple silicon
# macOS, packages it with completions, notices, and checksums, and attaches
# the result to a draft GitHub release. The client never provisions Nix and
# ships no privileged helper, private Nix bundle, or product catalog asset.

name: client-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-release
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: "1.96.1"

jobs:
  package:
    name: package (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 is the arm64 (Apple silicon) image; macos-15-intel is
          # the x64 one. aarch64-darwin therefore builds on macos-15.
          # Linux builds on ubuntu-22.04 so the client links against the
          # glibc 2.35 baseline; ubuntu-latest (24.04) produced binaries
          # that fail on older glibc with "GLIBC_2.39 not found".
          - runner: ubuntu-22.04
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        # v6.0.2 (verified: tag v6.0.2 -> de0fac2e4500dabe0009e67214ff5f5447ce83dd)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Check tag matches pkg-cli version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="pkg-cli"))')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v${tag} does not match pkg-cli version ${version}" >&2
            exit 1
          fi

      - name: Package client archive
        run: bash tools/release/package_client.sh "${{ matrix.system }}"

      - name: Inspect archive contents
        run: |
          set -eu
          shopt -s nullglob
          for f in dist/*-"${{ matrix.system }}".tar.gz; do
            tar -tzf "$f"
            # No privileged helpers, private Nix bundles, or catalog assets.
            if tar -tzf "$f" | grep -Ei 'broker|root-helper|pkg-install$|\.pkg$'; then
              echo "unexpected privileged or installer asset in archive" >&2
              exit 1
            fi
            # Third-party license texts and notices must ship (D9).
            if ! tar -tzf "$f" | grep -q '/licenses/THIRDPARTY.md$'; then
              echo "missing third-party license index in archive" >&2
              exit 1
            fi
          done
          cat dist/SHA256SUMS-"${{ matrix.system }}"

      - name: Upload archive artifact
        # v7.0.1 (verified: tag v7.0.1 -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pkg-client-${{ matrix.system }}
          path: dist/
          if-no-files-found: error

  publish:
    name: draft release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    # The artifacts API needs actions:read; draft publication needs
    # contents:write. Least privilege: only this job gets write.
    permissions:
      contents: write
      actions: read
    # gh is preinstalled on GitHub-hosted runners. GH_TOKEN authorizes it
    # and GH_REPO names the repository, so no checkout and no third-party
    # download action is needed.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download archives
        run: |
          set -eu
          # Download each artifact by name. Without --name, gh writes each
          # artifact into its own subdirectory and the merge step below
          # would not find the checksum files at dist/ root.
          gh run download "$GITHUB_RUN_ID" --name pkg-client-x86_64-linux --dir dist
          gh run download "$GITHUB_RUN_ID" --name pkg-client-aarch64-darwin --dir dist
          ls -l dist

      - name: Merge checksums
        run: |
          set -eu
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          rm dist/SHA256SUMS-*
          cd dist && sha256sum --check SHA256SUMS

      - name: Create draft release
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --draft --verify-tag \
            --title "pkg ${tag#v}" \
            --notes "Standalone client archives for x86_64 Linux and Apple silicon macOS. Requires an external Nix installation; see https://github.com/spa5k/pkg/blob/main/docs/install.md" \
            dist/*
