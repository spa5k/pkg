name: Check current public release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Signed alpha release currently served by the public channel
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: exact-release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Installation and daily use (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      FROM_RELEASE: ${{ inputs.release }}
      TO_RELEASE: ${{ inputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Prepare system-owned install directories on the disposable runner
        run: python3 tests/release-lifecycle/prepare_host.py
      - name: Check signed downloads, installation, repeat setup, build, and rollback
        run: >-
          python3 tests/release-lifecycle/check.py smoke
          --from-release "$FROM_RELEASE" --to-release "$TO_RELEASE"
          --work "$RUNNER_TEMP/pkg-release-proof" --confirm TEST-DISPOSABLE-HOST
      - name: Show results and proof scope
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/pkg-release-proof/summary.md" ]; then
            cat "$RUNNER_TEMP/pkg-release-proof/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nNative reboot is not performed on these hosted runners. Run the resume phase in the same disposable VM for reboot evidence.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep checks and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-check-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/pkg-release-proof/*.log
            ${{ runner.temp }}/pkg-release-proof/*.json
            ${{ runner.temp }}/pkg-release-proof/summary.md
          if-no-files-found: warn
          retention-days: 7
