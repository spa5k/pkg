name: DN-1 loopback debug
on: workflow_dispatch
permissions: { contents: read }
jobs:
  dbg:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - name: minimal TLS server patterns under python 3.14
        shell: bash
        run: |
          python3 - <<'PY' 2>&1 || true
          import http.server, pathlib, ssl, subprocess, sys, threading, time, urllib.request
          state = pathlib.Path("/tmp/dbg5"); state.mkdir(mode=0o700, exist_ok=True)
          import importlib.util
          spec = importlib.util.spec_from_file_location("spl", "tools/release/serve_pair_loopback.py")
          spl = importlib.util.module_from_spec(spec); spec.loader.exec_module(spl)
          spl.generate_certificate_material(state)

          pattern = sys.argv[1] if len(sys.argv) > 1 else "both"

          def run_pattern(name, port):
              code = '''
          import http.server, ssl, sys
          port = int(sys.argv[1]); mode = sys.argv[2]
          state = sys.argv[3]
          tls = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          tls.minimum_version = ssl.TLSVersion.TLSv1_2
          tls.load_cert_chain(certfile=state + "/server.pem", keyfile=state + "/server-key.pem")
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *a): pass
          if mode == "getrequest":
              class S(http.server.ThreadingHTTPServer):
                  daemon_threads = True
                  def get_request(self):
                      c, a = super().get_request()
                      return tls.wrap_socket(c, server_side=True), a
              srv = S(("127.0.0.1", port), H)
          else:
              class S(http.server.ThreadingHTTPServer):
                  daemon_threads = True
              srv = S(("127.0.0.1", port), H)
              srv.socket = tls.wrap_socket(srv.socket, server_side=True)
          srv.serve_forever()
              '''
              import tempfile, os
              proc = subprocess.Popen([sys.executable, "-c", code, str(port), name, str(state)])
              time.sleep(2.5)
              ctx = ssl.create_default_context(cafile=str(state / "ca.pem"))
              try:
                  with urllib.request.urlopen(f"https://127.0.0.1:{port}/", timeout=5, context=ctx) as r:
                      print(name, "PROBE OK", r.status)
              except Exception as e:
                  print(name, "PROBE FAIL", type(e).__name__, str(e)[:80])
              proc.terminate(); proc.wait()
              time.sleep(0.5)

          run_pattern("listenwrap", 8451)
          run_pattern("getrequest", 8452)
          PY
          exit 0
