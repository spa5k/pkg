name: DN-1 loopback debug
on: workflow_dispatch
permissions: { contents: read }
jobs:
  dbg:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - name: Drive the tool internals with full diagnostics
        shell: bash
        run: |
          python3 - <<'PY' 2>&1 || true
          import importlib.util, pathlib, subprocess, sys, time, ssl, urllib.request
          spec = importlib.util.spec_from_file_location("spl", "tools/release/serve_pair_loopback.py")
          spl = importlib.util.module_from_spec(spec); spec.loader.exec_module(spl)
          staging = pathlib.Path("/tmp/dbg/staging")
          sys.path.insert(0, "tools/release")
          from test_serve_pair_loopback import pair
          pair(staging)
          print("== validate_pair")
          records = spl.validate_pair(staging)
          print("records:", len(records))
          print("== certs")
          state = pathlib.Path("/tmp/dbg/state3"); state.mkdir(mode=0o700, parents=True, exist_ok=True)
          spl.generate_certificate_material(state)
          print("cert files:", sorted(p.name for p in state.iterdir()))
          print("== spawn _serve")
          pub = pathlib.Path("/tmp/dbg/pub")
          import shutil; shutil.copytree(staging, pub)
          log = (state / "http.log").open("wb")
          server = subprocess.Popen([sys.executable, "-I", "tools/release/serve_pair_loopback.py",
              "_serve", str(pub), "8444", str(state)], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
          time.sleep(3)
          print("server pid:", server.pid, "poll:", server.poll())
          log.close()
          print("== http.log:")
          print((state / "http.log").read_text()[-2000:])
          print("== probe with CA")
          ctx = ssl.create_default_context(cafile=str(state / "ca.pem"))
          try:
              with urllib.request.urlopen("https://127.0.0.1:8444/proof-pair.json", timeout=5, context=ctx) as r:
                  print("status:", r.status, "bytes:", len(r.read()))
          except Exception as e:
              print("PROBE FAIL:", type(e).__name__, e)
          print("== raw curl")
          subprocess.run(["curl", "-sk", "--max-time", "5", "https://127.0.0.1:8444/proof-pair.json",
              "-o", "/dev/null", "-w", "curl http %{http_code}\n"])
          server.terminate()
          PY
          exit 0
