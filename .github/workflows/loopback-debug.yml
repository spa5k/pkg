name: DN-1 loopback debug
on: workflow_dispatch
permissions: { contents: read }
jobs:
  dbg:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - name: plain http vs tls on loopback
        shell: bash
        run: |
          python3 - <<'PY' 2>&1 || true
          import http.server, subprocess, sys, time, urllib.request, pathlib, importlib.util, ssl
          code_tls = '''
          import http.server, ssl, sys
          tls = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          tls.load_cert_chain(certfile=sys.argv[3] + "/server.pem", keyfile=sys.argv[3] + "/server-key.pem")
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *a): pass
          class S(http.server.ThreadingHTTPServer): daemon_threads = True
          srv = S(("127.0.0.1", int(sys.argv[1])), H)
          srv.socket = tls.wrap_socket(srv.socket, server_side=True)
          srv.serve_forever()
          '''
          code_plain = '''
          import http.server, sys
          class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *a): pass
          class S(http.server.ThreadingHTTPServer): daemon_threads = True
          S(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          '''
          state = pathlib.Path("/tmp/dbg6"); state.mkdir(mode=0o700, exist_ok=True)
          spec = importlib.util.spec_from_file_location("spl", "tools/release/serve_pair_loopback.py")
          spl = importlib.util.module_from_spec(spec); spec.loader.exec_module(spl)
          spl.generate_certificate_material(state)
          root = pathlib.Path("/tmp/dbg6/root"); root.mkdir(exist_ok=True)
          (root / "hello.txt").write_text("ok")
          def probe(name, port):
              try:
                  ctx = ssl.create_default_context(cafile=str(state / "ca.pem"))
                  kw = {"context": ctx} if "tls" in name else {}
                  with urllib.request.urlopen(f"https://127.0.0.1:{port}/hello.txt" if "tls" in name else f"http://127.0.0.1:{port}/hello.txt", timeout=5, **kw) as r:
                      print(name, "OK", r.status, r.read()[:20])
              except Exception as e:
                  print(name, "FAIL", type(e).__name__, str(e)[:60])
          p1 = subprocess.Popen([sys.executable, "-c", code_plain, "8461"])
          p2 = subprocess.Popen([sys.executable, "-c", code_tls, "8462", "x", str(state)])
          time.sleep(2.5)
          probe("plain-http", 8461)
          probe("tls", 8462)
          p1.terminate(); p2.terminate()
          PY
          exit 0
