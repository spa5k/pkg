name: Sign release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft alpha release tag
        required: true
        type: string
      expected_sha:
        description: Exact commit signed by dn16-proof-workflow-1
        required: true
        type: string
permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  COSIGN_CERTIFICATE_IDENTITY: https://github.com/spa5k/pkg/.github/workflows/publish-release.yml@refs/tags/dn16-proof-workflow-1
  COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  validate-dispatch:
    name: Validate immutable proof dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate immutable proof dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/tags/dn16-proof-workflow-1"
          test "$GITHUB_REPOSITORY" = "spa5k/pkg"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_SHA"
          expected_identity="https://github.com/spa5k/pkg/.github/workflows/publish-release.yml@refs/tags/dn16-proof-workflow-1"
          test "$COSIGN_CERTIFICATE_IDENTITY" = "$expected_identity"
          test "$COSIGN_CERTIFICATE_OIDC_ISSUER" = "https://token.actions.githubusercontent.com"

  sign-and-publish:
    name: Sign exact release assets
    needs: validate-dispatch
    if: >-
      github.ref == 'refs/tags/dn16-proof-workflow-1' &&
      github.sha == inputs.expected_sha &&
      github.workflow_sha == inputs.expected_sha
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate the draft and download exact inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.1\.0-alpha\.[1-9][0-9]*$ ]]
          test "$GITHUB_REPOSITORY" = "spa5k/pkg"
          expected_identity="https://github.com/spa5k/pkg/.github/workflows/publish-release.yml@refs/tags/dn16-proof-workflow-1"
          test "$COSIGN_CERTIFICATE_IDENTITY" = "$expected_identity"
          test "$COSIGN_CERTIFICATE_OIDC_ISSUER" = "https://token.actions.githubusercontent.com"

          release_id=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '.[] | [.tag_name, .id] | @tsv' |
              awk -F '\t' -v tag="$RELEASE_TAG" '$1 == tag { print $2 }'
          )
          [[ "$release_id" =~ ^[0-9]+$ ]]
          export RELEASE_ID="$release_id"
          printf 'RELEASE_ID=%s\n' "$release_id" >>"$GITHUB_ENV"
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)
          test "$draft" = true
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null

          version=${RELEASE_TAG#v}
          base_assets=(
            1.root.json
            install.sh
            "pkg-${version}-preview.pkg"
            pkg-aarch64-darwin
            pkg-installer-x86_64-linux
            "pkg-${RELEASE_TAG}-linux-x86_64.tar.gz"
            "pkg-${RELEASE_TAG}-macos-aarch64.tar.gz"
            pkg-x86_64-linux
            release-manifest.json
            SHA256SUMS
          )
          generated_assets=(
            COSIGN_IDENTITY.txt
            COSIGN_ISSUER.txt
            "pkg-${version}-preview.pkg.sigstore.json"
            pkg-aarch64-darwin.sigstore.json
            pkg-installer-x86_64-linux.sigstore.json
            "pkg-${RELEASE_TAG}-linux-x86_64.tar.gz.sigstore.json"
            "pkg-${RELEASE_TAG}-macos-aarch64.tar.gz.sigstore.json"
            pkg-x86_64-linux.sigstore.json
            SHA256SUMS.sigstore.json
          )
          mapfile -t actual_assets < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq '.assets[].name'
          )
          generated_count=0
          checksum_signature_present=false
          for actual in "${actual_assets[@]}"; do
            allowed=false
            for expected in "${base_assets[@]}"; do
              if [[ "$actual" == "$expected" ]]; then
                allowed=true
                break
              fi
            done
            for expected in "${generated_assets[@]}"; do
              if [[ "$actual" == "$expected" ]]; then
                allowed=true
                generated_count=$((generated_count + 1))
                if [[ "$actual" == SHA256SUMS.sigstore.json ]]; then
                  checksum_signature_present=true
                fi
                break
              fi
            done
            test "$allowed" = true
          done
          payload_generated_count=$generated_count
          if [[ "$checksum_signature_present" == true ]]; then
            payload_generated_count=$((payload_generated_count - 1))
          fi
          payload_generated_total=$((${#generated_assets[@]} - 1))
          if ((payload_generated_count != 0 && payload_generated_count != payload_generated_total)); then
            exit 1
          fi
          if [[ "$checksum_signature_present" == true ]] \
            && ((payload_generated_count != payload_generated_total)); then
            exit 1
          fi
          if ((payload_generated_count == 0)); then
            printf 'MANIFEST_INPUT_STATE=prepared\n' >>"$GITHUB_ENV"
          else
            printf 'MANIFEST_INPUT_STATE=sealed\n' >>"$GITHUB_ENV"
          fi

          mkdir release-assets
          for asset in "${base_assets[@]}"; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir release-assets
          done
          if ((payload_generated_count > 0)); then
            for asset in "${generated_assets[@]}"; do
              if [[ "$asset" == SHA256SUMS.sigstore.json ]]; then
                continue
              fi
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" \
                --dir release-assets
            done
          fi
          if [[ "$checksum_signature_present" == true ]]; then
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS.sigstore.json \
              --dir release-assets
          fi

          : >release-assets/BASE_SHA256SUMS
          for asset in "${base_assets[@]}"; do
            if [[ "$asset" == SHA256SUMS ]]; then
              continue
            fi
            matches=$(awk -v name="$asset" '$2 == name { count += 1; line = $0 } END { if (count == 1) print line }' \
              release-assets/SHA256SUMS)
            test -n "$matches"
            printf '%s\n' "$matches" >>release-assets/BASE_SHA256SUMS
          done
          (cd release-assets && sha256sum --check --strict BASE_SHA256SUMS)

      - name: Sign and verify all payloads
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          signable_assets=(
            "pkg-${version}-preview.pkg"
            pkg-aarch64-darwin
            pkg-installer-x86_64-linux
            "pkg-${RELEASE_TAG}-linux-x86_64.tar.gz"
            "pkg-${RELEASE_TAG}-macos-aarch64.tar.gz"
            pkg-x86_64-linux
          )
          for asset in "${signable_assets[@]}"; do
            bundle="release-assets/${asset}.sigstore.json"
            if [[ ! -f "$bundle" ]]; then
              cosign sign-blob \
                --yes \
                --bundle "$bundle" \
                "release-assets/${asset}"
            fi
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
              "release-assets/${asset}"
          done
          if [[ -f release-assets/COSIGN_IDENTITY.txt ]]; then
            test "$(cat release-assets/COSIGN_IDENTITY.txt)" = "$COSIGN_CERTIFICATE_IDENTITY"
            test "$(cat release-assets/COSIGN_ISSUER.txt)" = "$COSIGN_CERTIFICATE_OIDC_ISSUER"
          fi
          printf '%s\n' "$COSIGN_CERTIFICATE_IDENTITY" >release-assets/COSIGN_IDENTITY.txt
          printf '%s\n' "$COSIGN_CERTIFICATE_OIDC_ISSUER" >release-assets/COSIGN_ISSUER.txt

      - name: Seal and validate the draft manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=release-assets/release-manifest.json
          manifest_state=$(python3 - "$manifest" release-assets/1.root.json \
            release-assets "$RELEASE_TAG" "$MANIFEST_INPUT_STATE" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          root_path = pathlib.Path(sys.argv[2])
          asset_root = pathlib.Path(sys.argv[3])
          release_tag = sys.argv[4]
          input_state = sys.argv[5]


          def fail(message):
              raise ValueError(message)


          def regular_bytes(path, name):
              if path.is_symlink() or not path.is_file():
                  fail(f"{name} must be a regular file")
              return path.read_bytes()


          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      fail(f"duplicate JSON key: {key}")
                  value[key] = item
              return value


          def identity(data):
              return hashlib.sha256(data).hexdigest(), len(data)


          try:
              manifest = json.loads(
                  regular_bytes(manifest_path, "release manifest"),
                  object_pairs_hook=unique_object,
                  parse_constant=lambda value: fail(f"invalid JSON value: {value}"),
              )
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise ValueError("release manifest is not strict JSON") from error
          if not isinstance(manifest, dict) or manifest.get("releaseId") != release_tag:
              fail("release manifest has the wrong release ID")
          if input_state not in {"prepared", "sealed"}:
              fail("release manifest input state is invalid")
          root_digest, _ = identity(regular_bytes(root_path, "trusted root"))
          if manifest.get("trustedRootSha256") != root_digest:
              fail("release manifest has the wrong trusted root")

          expected = {
              ("pkg", "aarch64-darwin", "cli/pkg-aarch64-darwin"):
                  "cli/pkg-aarch64-darwin.sigstore.json",
              ("pkg", "x86_64-linux", "cli/pkg-x86_64-linux"):
                  "cli/pkg-x86_64-linux.sigstore.json",
              ("pkg-install", "x86_64-linux", "cli/pkg-installer-x86_64-linux"):
                  "cli/pkg-installer-x86_64-linux.sigstore.json",
          }
          records = manifest.get("cliArtifacts")
          if not isinstance(records, list) or len(records) != len(expected):
              fail("release manifest must contain the three exact CLI artifacts")

          bundle_keys = (
              "sigstoreBundle",
              "sigstoreBundleSha256",
              "sigstoreBundleLength",
          )
          seen = set()
          for record in records:
              if not isinstance(record, dict):
                  fail("CLI artifact must be an object")
              key = (record.get("kind"), record.get("system"), record.get("source"))
              if key not in expected or key in seen:
                  fail("release manifest has an unexpected CLI artifact")
              seen.add(key)

              source_data = regular_bytes(
                  asset_root / key[2].removeprefix("cli/"), "CLI artifact"
              )
              source_digest, source_length = identity(source_data)
              if (
                  record.get("sha256") != source_digest
                  or type(record.get("length")) is not int
                  or record["length"] != source_length
              ):
                  fail("CLI artifact identity does not match the manifest")

              present = [field in record for field in bundle_keys]
              if input_state == "prepared" and any(present):
                  fail("prepared CLI artifact already has Sigstore bundle identity")
              if input_state == "sealed" and not all(present):
                  fail("sealed CLI artifact has incomplete Sigstore bundle identity")

              bundle_name = expected[key]
              bundle_data = regular_bytes(
                  asset_root / bundle_name.removeprefix("cli/"), "Sigstore bundle"
              )
              bundle_digest, bundle_length = identity(bundle_data)
              if input_state == "prepared":
                  record.update(
                      {
                          "sigstoreBundle": bundle_name,
                          "sigstoreBundleSha256": bundle_digest,
                          "sigstoreBundleLength": bundle_length,
                      }
                  )
              elif (
                  record["sigstoreBundle"] != bundle_name
                  or record["sigstoreBundleSha256"] != bundle_digest
                  or type(record["sigstoreBundleLength"]) is not int
                  or record["sigstoreBundleLength"] != bundle_length
              ):
                  fail("Sigstore bundle identity does not match the manifest")

          if seen != set(expected):
              fail("release manifest has incomplete CLI artifacts")
          if input_state == "prepared":
              sealed_path = manifest_path.with_name("release-manifest.json.sealed")
              if sealed_path.exists() or sealed_path.is_symlink():
                  fail("temporary sealed manifest path already exists")
              with sealed_path.open("x", encoding="utf-8") as output:
                  output.write(
                      json.dumps(manifest, sort_keys=True, separators=(",", ":"))
                      + "\n"
                  )
              sealed_path.replace(manifest_path)
          print(input_state)
          PY
          )
          case "$manifest_state" in
            prepared)
              rm -f release-assets/SHA256SUMS.sigstore.json
              ;;
            sealed) ;;
            *) exit 1 ;;
          esac

      - name: Upload verified signatures and checksums
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          checksum_assets=(
            1.root.json
            COSIGN_IDENTITY.txt
            COSIGN_ISSUER.txt
            install.sh
            "pkg-${version}-preview.pkg"
            "pkg-${version}-preview.pkg.sigstore.json"
            pkg-aarch64-darwin
            pkg-aarch64-darwin.sigstore.json
            pkg-installer-x86_64-linux
            pkg-installer-x86_64-linux.sigstore.json
            "pkg-${RELEASE_TAG}-linux-x86_64.tar.gz"
            "pkg-${RELEASE_TAG}-linux-x86_64.tar.gz.sigstore.json"
            "pkg-${RELEASE_TAG}-macos-aarch64.tar.gz"
            "pkg-${RELEASE_TAG}-macos-aarch64.tar.gz.sigstore.json"
            pkg-x86_64-linux
            pkg-x86_64-linux.sigstore.json
            release-manifest.json
          )
          (cd release-assets && sha256sum "${checksum_assets[@]}" >SHA256SUMS)
          checksum_bundle=release-assets/SHA256SUMS.sigstore.json
          if [[ ! -f "$checksum_bundle" ]]; then
            cosign sign-blob \
              --yes \
              --bundle "$checksum_bundle" \
              release-assets/SHA256SUMS
          fi
          cosign verify-blob \
            --bundle "$checksum_bundle" \
            --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
            release-assets/SHA256SUMS
          upload_assets=(
            release-assets/COSIGN_IDENTITY.txt
            release-assets/COSIGN_ISSUER.txt
            release-assets/release-manifest.json
            "release-assets/pkg-${version}-preview.pkg.sigstore.json"
            release-assets/pkg-aarch64-darwin.sigstore.json
            release-assets/pkg-installer-x86_64-linux.sigstore.json
            "release-assets/pkg-${RELEASE_TAG}-linux-x86_64.tar.gz.sigstore.json"
            "release-assets/pkg-${RELEASE_TAG}-macos-aarch64.tar.gz.sigstore.json"
            release-assets/pkg-x86_64-linux.sigstore.json
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sigstore.json
          )
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)" \
            = "$RELEASE_TAG"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)" \
            = true
          gh release upload "$RELEASE_TAG" "${upload_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          mkdir remote-assets
          for asset in "${upload_assets[@]}"; do
            name=${asset#release-assets/}
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$name" \
              --dir remote-assets
            cmp "$asset" "remote-assets/$name"
          done
