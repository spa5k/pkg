# cask-catalog — maintainer tool for the pkg Cask catalog.
#
# `fetch` and `import-tap` are bounded network steps (maintainer machines
# only); `import-tap` additionally drives a local sandboxed Nix build.
# `generate` reads the pinned input and writes deterministic catalog data.

[package]
name = "cask-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
description = "Maintainer tool for the pkg Cask catalog: pinned snapshot generation and raw public tap import"

[dependencies]
# Static enum names are derived at compile time; no runtime conversion.
strum_macros = "=0.28.0"
pkg-process = { path = "../../crates/pkg-process" }
libc = "=0.2.190"
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = "=1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
url = "=2.5.8"

[lints]
workspace = true
