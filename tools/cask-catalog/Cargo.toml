# cask-catalog — maintainer tool that generates the pkg Cask catalog.
#
# Offline by contract: `fetch` is the only network step (curl subprocess,
# maintainer machines only). `generate` reads the pinned input and writes
# deterministic catalog data. See openspec/changes/generate-cask-catalog-with-rust.

[package]
name = "cask-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
description = "Generate the normalized Homebrew Cask catalog consumed by the pkg casks source"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[lints]
workspace = true
