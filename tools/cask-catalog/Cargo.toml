# cask-catalog — maintainer tool for the pkg Cask catalog.
#
# `fetch` and `import-tap` are bounded network steps (maintainer machines
# only); `import-tap` additionally drives a local sandboxed Nix build.
# `generate` reads the pinned input and writes deterministic catalog data.

[package]
name = "cask-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
description = "Maintainer tool for the pkg Cask catalog: pinned snapshot generation and raw public tap import"

[dependencies]
libc = "=0.2.189"
clap = { version = "=4.6.6", features = ["derive"] }
flate2 = "=1.1.10"
reqwest = { version = "=0.12.28", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = "=0.4.46"
tempfile = "=3.27.0"
url = "=2.5.8"

[lints]
workspace = true
