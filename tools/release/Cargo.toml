# Publisher-side release policy and TUF signing boundary.

[package]
name = "pkg-release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "=0.1.92"
aws-lc-rs = "=1.18.0"
hex = "=0.4.3"
jiff = { version = "=0.2.35", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["fs"] }
tough = { version = "=0.24.0", default-features = false }
url = "=2.5.8"

[dev-dependencies]
olpc-cjson = "=0.1.4"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
