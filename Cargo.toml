# `pkg` root workspace.
#
# PR-1 began with `pkg-core`; later dependency-safe milestones add their owned
# crates here. Keeping every production crate in the root member list makes the
# standard build, lint, documentation, and dependency gates cover it by default.
#
# License: intentionally ABSENT. The project license is deferred (DR-015 in
# plans/12-open-decisions-and-risks.md). No `license` key is set here or in any
# member manifest, `publish = false`, and no source files carry SPDX headers.

[workspace]
resolver = "3"
members = [
    "crates/pkg-channel",
    "crates/pkg-cli",
    "crates/pkg-core",
    "crates/pkg-index",
    "crates/pkg-installer",
    "crates/pkg-macos-security",
    "crates/pkg-nix",
    "crates/pkg-pipeline",
    "crates/pkg-resolver",
    "crates/pkg-store",
    "crates/pkg-testkit",
    "tools/release",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
