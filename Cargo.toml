# `pkg` root workspace.
#
# Design D1: one application crate (`pkg-cli`) owns the whole native Nix
# client. The old product engine crates were deleted with their callers.
#
# Licensed under Apache-2.0. See LICENSE and DR-015.

[workspace]
resolver = "3"
members = ["crates/pkg-cli", "tools/cask-catalog"]

[workspace.package]
version = "0.2.0-alpha.9"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

# Lint policy: every crate in the workspace inherits these levels
# through its `[lints]` table, and CI holds them at
# `cargo clippy --locked --all-targets -- -D warnings` on Linux plus the
# macOS smoke Clippy step. The deny set is clean in every target on
# every supported platform. `unwrap_used`, `expect_used`, and `panic`
# are individually selected restriction lints (not group enables):
# production code denies explicit unwrap/expect/panic; each crate root
# opts test builds out once with a reasoned `cfg_attr(test, allow(...))`. Suppressions stay
# expensive: every `allow` must carry a `reason`
# (clippy::allow_attributes_without_reason).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_assignments = "deny"
dead_code = "deny"

[workspace.lints.clippy]
all = "deny"
allow_attributes_without_reason = "deny"
derive_partial_eq_without_eq = "deny"
float_cmp = "deny"
fn_params_excessive_bools = "deny"
future_not_send = "deny"
missing_fields_in_debug = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"
needless_lifetimes = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
redundant_pub_crate = "deny"
suspicious_operation_groupings = "deny"
too_long_first_doc_paragraph = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
