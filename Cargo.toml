# `pkg` root workspace.
#
# A single real member crate (`pkg-core`) is required even in PR-1: a memberless
# virtual workspace makes `cargo build`/`check`/`clippy`/`doc` fail 101 and
# `fmt` fail 1. PR-2 fills `pkg-core` with domain types/logic/tests; PR-1 only
# stands up the scaffold so the toolchain is operable against a real crate.
#
# License: intentionally ABSENT. The project license is deferred (DR-015 in
# plans/12-open-decisions-and-risks.md). No `license` key is set here or in any
# member manifest, `publish = false`, and no source files carry SPDX headers.

[workspace]
resolver = "3"
members = ["crates/pkg-core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
