# cargo-deny configuration for the `pkg` workspace.
#
# Targeted at cargo-deny 0.20.2 (the version pinned in
# .github/workflows/ci-fast.yml via `cargo install --locked cargo-deny@0.20.2`).
#
# IMPORTANT — the allowlist below is a dependency policy. `pkg` itself uses
# Apache-2.0 as recorded in DR-015. Private workspace crates remain ignored by
# this dependency check because they are not published.

# Dependency graph to check: all features, across all four planned v1 hosts.
[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
# No advisories are silently ignored; yanked crates are denied; unmaintained
# crates are only reported when reachable from a workspace member.
yanked = "deny"
ignore = []
unmaintained = "workspace"

[licenses]
version = 2
# Permissive dependency allowlist. See the note above.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Private workspace crates are ignored because they are not published.
include-dev = true
include-build = true
# An allowed license with no current consumer should not fail the skeleton.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
# Wildcards (crate = "*") are denied; multiple versions are only warned; path
# wildcards are allowed. No skips or exceptions.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io (cargo-deny's implicit allowed default registry) is permitted;
# no git sources are allowed.
unknown-registry = "deny"
unknown-git = "deny"
