<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">pkg</title>
  <desc id="desc">Familiar package commands on top of Nix. Nixpkgs, Homebrew Casks and Formulae, and GitHub flakes in one Nix profile.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1f2735"/>
    </pattern>
    <radialGradient id="glow" cx="960" cy="300" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#54a99c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#54a99c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0f131a"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Mark and wordmark -->
  <g transform="translate(68 60) scale(0.52)">
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M116 72 L176.6 107 L176.6 177 L116 212 L55.4 177 L55.4 107 Z" stroke="#364154" stroke-width="9"/>
      <path d="M140 48 L200.6 83 L200.6 153 L140 188 L79.4 153 L79.4 83 Z" fill="#0f131a" stroke="#54a99c" stroke-width="11"/>
      <path d="M140 48 L200.6 83 L140 118 L79.4 83 Z" fill="#54a99c" fill-opacity="0.16" stroke="none"/>
      <path d="M79.4 83 L140 118 L200.6 83 M140 118 L140 188" stroke="#54a99c" stroke-width="11"/>
    </g>
    <circle cx="140" cy="118" r="13" fill="#d99a4e" stroke="#0f131a" stroke-width="5"/>
  </g>
  <text x="200" y="156" fill="#ece5d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="96" font-weight="700" letter-spacing="-2">pkg</text>

  <!-- Message -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="282" fill="#ece5d6" font-size="52" font-weight="600" letter-spacing="-0.5">Familiar package</text>
    <text x="80" y="344" fill="#ece5d6" font-size="52" font-weight="600" letter-spacing="-0.5">commands on top of Nix.</text>
    <text x="80" y="410" fill="#c5beae" font-size="26">Nixpkgs, Homebrew Casks and Formulae,</text>
    <text x="80" y="446" fill="#c5beae" font-size="26">and GitHub flakes in one Nix profile.</text>
  </g>

  <!-- Properties -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#c5beae">
    <rect x="80" y="484" width="204" height="42" rx="21" fill="#151b25" stroke="#2a3344"/>
    <text x="182" y="511" text-anchor="middle">signed releases</text>
    <rect x="296" y="484" width="124" height="42" rx="21" fill="#151b25" stroke="#2a3344"/>
    <text x="358" y="511" text-anchor="middle">rollback</text>
    <rect x="432" y="484" width="136" height="42" rx="21" fill="#151b25" stroke="#2a3344"/>
    <text x="500" y="511" text-anchor="middle">no daemon</text>
  </g>

  <!-- Terminal -->
  <g transform="translate(724 150)">
    <rect width="476" height="304" rx="14" fill="#1b2230" stroke="#2a3344"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 h448 a14 14 0 0 1 14 14 v26 h-476 z" fill="#151b25"/>
    <line x1="0" y1="40" x2="476" y2="40" stroke="#2a3344"/>
    <circle cx="24" cy="20" r="6" fill="#364154"/>
    <circle cx="45" cy="20" r="6" fill="#364154"/>
    <circle cx="66" cy="20" r="6" fill="#364154"/>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20">
      <text x="28" y="88"><tspan fill="#54a99c">$</tspan><tspan fill="#ece5d6"> pkg install rg</tspan></text>
      <text x="28" y="122" fill="#8f8a7c">Resolving: rg</text>
      <text x="28" y="156" fill="#c5beae">ripgrep provides the `rg` command.</text>
      <text x="28" y="190" fill="#8f8a7c">Installing: ripgrep</text>
      <text x="28" y="224"><tspan fill="#82b07a">Installed</tspan><tspan fill="#ece5d6"> ripgrep 15.2.0</tspan></text>
      <text x="28" y="258" fill="#c5beae">Commands: rg</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="80" y1="560" x2="1200" y2="560" stroke="#232c3b"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#8f8a7c">
    <text x="80" y="598">github.com/spa5k/pkg</text>
    <text x="1200" y="598" text-anchor="end">alpha · Linux x86-64 · macOS Apple silicon</text>
  </g>
</svg>
