<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="488" viewBox="0 0 1000 488" role="img" aria-labelledby="title desc">
  <title id="title">How pkg protects releases, catalogs, and your computer</title>
  <desc id="desc">Releases: a signed tag, a CI build with pinned actions, a SHA256SUMS file, a release signature made outside CI, and a pkg update that checks both before it test-runs the new client. Catalogs: signed Homebrew API data, a signature check with Homebrew's key, a payload pinned by SHA-256, a pull request with required checks, and a Nix build with a fixed hash for each download. On your computer: input checks, approval prompts for taps and flakes, no extra daemon or root helper, codesign and Gatekeeper checks for macOS apps, and terminal output without escape codes.</desc>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g font-size="12" font-weight="600" letter-spacing="1.4" fill="#8b949e">
      <text x="32" y="52">PKG RELEASES</text>
      <text x="32" y="200">HOMEBREW CATALOGS</text>
      <text x="32" y="348">ON YOUR COMPUTER</text>
    </g>

    <!-- Cards: 168 wide, 24 apart. -->
    <g fill="#151b23" stroke="#30363d">
      <rect x="32" y="68" width="168" height="92" rx="10"/>
      <rect x="224" y="68" width="168" height="92" rx="10"/>
      <rect x="416" y="68" width="168" height="92" rx="10"/>
      <rect x="608" y="68" width="168" height="92" rx="10"/>
      <rect x="800" y="68" width="168" height="92" rx="10"/>
      <rect x="32" y="216" width="168" height="92" rx="10"/>
      <rect x="224" y="216" width="168" height="92" rx="10"/>
      <rect x="416" y="216" width="168" height="92" rx="10"/>
      <rect x="608" y="216" width="168" height="92" rx="10"/>
      <rect x="800" y="216" width="168" height="92" rx="10"/>
      <rect x="32" y="364" width="168" height="92" rx="10"/>
      <rect x="224" y="364" width="168" height="92" rx="10"/>
      <rect x="416" y="364" width="168" height="92" rx="10"/>
      <rect x="608" y="364" width="168" height="92" rx="10"/>
      <rect x="800" y="364" width="168" height="92" rx="10"/>
    </g>

    <!-- Chain arrows -->
    <g fill="none" stroke="#6e7681" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M208 108 L215 114 L208 120"/><path d="M400 108 L407 114 L400 120"/><path d="M592 108 L599 114 L592 120"/><path d="M784 108 L791 114 L784 120"/>
      <path d="M208 256 L215 262 L208 268"/><path d="M400 256 L407 262 L400 268"/><path d="M592 256 L599 262 L592 268"/><path d="M784 256 L791 262 L784 268"/>
    </g>

    <!-- Titles -->
    <g font-size="15.5" font-weight="600" fill="#f0f6fc">
      <text x="48" y="100">Signed tag</text>
      <text x="240" y="100">CI build</text>
      <text x="432" y="100">SHA256SUMS</text>
      <text x="624" y="100">Release signature</text>
      <text x="816" y="100">pkg update</text>
      <text x="48" y="248">Homebrew API</text>
      <text x="240" y="248">Signature check</text>
      <text x="432" y="248">Pinned payload</text>
      <text x="624" y="248">Pull request</text>
      <text x="816" y="248">Nix build</text>
      <text x="48" y="396">Input checks</text>
      <text x="240" y="396">Approval</text>
      <text x="432" y="396">No extra services</text>
      <text x="624" y="396">macOS apps</text>
      <text x="816" y="396">Clean output</text>
    </g>

    <!-- Captions -->
    <g font-size="13" fill="#c9d1d9">
      <text x="48" y="124">SSH signature by</text><text x="48" y="143">the maintainer</text>
      <text x="240" y="124">Pinned actions and</text><text x="240" y="143">Rust toolchain</text>
      <text x="432" y="124">One SHA-256 for</text><text x="432" y="143">each archive</text>
      <text x="624" y="124">Made outside CI</text><text x="624" y="143">with the release key</text>
      <text x="816" y="124">Checks both, then</text><text x="816" y="143">test-runs the client</text>

      <text x="48" y="272">Signed JSON from</text><text x="48" y="291">formulae.brew.sh</text>
      <text x="240" y="272">Homebrew's key,</text><text x="240" y="291">the same as brew</text>
      <text x="432" y="272">SHA-256 recorded</text><text x="432" y="291">in this repository</text>
      <text x="624" y="272">Required checks</text><text x="624" y="291">before each merge</text>
      <text x="816" y="272">Fixed hash for</text><text x="816" y="291">each download</text>

      <text x="48" y="420">Names and options</text><text x="48" y="439">checked before Nix</text>
      <text x="240" y="420">Prompts for taps</text><text x="240" y="439">and GitHub flakes</text>
      <text x="432" y="420">pkg adds no daemon</text><text x="432" y="439">or root helper</text>
      <text x="624" y="420">codesign and</text><text x="624" y="439">Gatekeeper checks</text>
      <text x="816" y="420">Escape codes taken</text><text x="816" y="439">out of Nix text</text>
    </g>
  </g>
</svg>
