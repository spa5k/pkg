<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">pkg</title>
  <desc id="desc">Familiar package commands on top of Nix. Sources: Nixpkgs, Homebrew Casks, Homebrew Formulae, and GitHub flakes.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1f2735"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#0f131a"/>
    <rect width="1280" height="400" fill="url(#dots)"/>

    <!-- Mark -->
    <g transform="translate(80 84) scale(0.5)">
      <g fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M116 72 L176.6 107 L176.6 177 L116 212 L55.4 177 L55.4 107 Z" stroke="#364154" stroke-width="9"/>
        <path d="M140 48 L200.6 83 L200.6 153 L140 188 L79.4 153 L79.4 83 Z" fill="#0f131a" stroke="#54a99c" stroke-width="11"/>
        <path d="M140 48 L200.6 83 L140 118 L79.4 83 Z" fill="#54a99c" fill-opacity="0.16" stroke="none"/>
        <path d="M79.4 83 L140 118 L200.6 83 M140 118 L140 188" stroke="#54a99c" stroke-width="11"/>
      </g>
      <circle cx="140" cy="118" r="13" fill="#d99a4e" stroke="#0f131a" stroke-width="5"/>
    </g>

    <!-- Wordmark and tagline -->
    <text x="222" y="176" fill="#ece5d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="104" font-weight="700" letter-spacing="-2">pkg</text>
    <text x="88" y="262" fill="#c5beae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Familiar package commands on top of Nix.</text>

    <!-- Sources -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#c5beae">
      <rect x="88" y="290" width="92" height="34" rx="17" fill="#151b25" stroke="#2a3344"/>
      <text x="134" y="312" text-anchor="middle">Nixpkgs</text>
      <rect x="192" y="290" width="160" height="34" rx="17" fill="#151b25" stroke="#2a3344"/>
      <text x="272" y="312" text-anchor="middle">Homebrew Casks</text>
      <rect x="364" y="290" width="188" height="34" rx="17" fill="#151b25" stroke="#2a3344"/>
      <text x="458" y="312" text-anchor="middle">Homebrew Formulae</text>
      <rect x="564" y="290" width="150" height="34" rx="17" fill="#151b25" stroke="#2a3344"/>
      <text x="639" y="312" text-anchor="middle">GitHub flakes</text>
    </g>

    <!-- Terminal -->
    <g transform="translate(792 84)">
      <rect width="400" height="240" rx="12" fill="#1b2230" stroke="#2a3344"/>
      <path d="M0 12 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v22 h-400 z" fill="#151b25"/>
      <line x1="0" y1="34" x2="400" y2="34" stroke="#2a3344"/>
      <circle cx="20" cy="17" r="5" fill="#364154"/>
      <circle cx="38" cy="17" r="5" fill="#364154"/>
      <circle cx="56" cy="17" r="5" fill="#364154"/>
      <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
        <text x="24" y="70"><tspan fill="#54a99c">$</tspan><tspan fill="#ece5d6"> pkg install rg</tspan></text>
        <text x="24" y="98" fill="#8f8a7c">Resolving: rg</text>
        <text x="24" y="124" fill="#c5beae">ripgrep provides the `rg` command.</text>
        <text x="24" y="150" fill="#8f8a7c">Installing: ripgrep</text>
        <text x="24" y="178"><tspan fill="#82b07a">Installed</tspan><tspan fill="#ece5d6"> ripgrep 15.2.0</tspan></text>
        <text x="24" y="204" fill="#c5beae">Commands: rg</text>
      </g>
    </g>
  </g>
</svg>
