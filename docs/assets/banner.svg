<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">pkg</title>
  <desc id="desc">Familiar package commands on top of Nix.</desc>
  <rect width="1280" height="320" rx="24" fill="#0f131a"/>

  <!-- Mark -->
  <g transform="translate(80 64) scale(0.5)">
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M116 72 L176.6 107 L176.6 177 L116 212 L55.4 177 L55.4 107 Z" stroke="#364154" stroke-width="9"/>
      <path d="M140 48 L200.6 83 L200.6 153 L140 188 L79.4 153 L79.4 83 Z" fill="#0f131a" stroke="#54a99c" stroke-width="11"/>
      <path d="M79.4 83 L140 118 L200.6 83 M140 118 L140 188" stroke="#54a99c" stroke-width="11"/>
    </g>
    <circle cx="140" cy="118" r="13" fill="#d99a4e" stroke="#0f131a" stroke-width="5"/>
  </g>

  <!-- Wordmark and tagline -->
  <text x="222" y="156" fill="#ece5d6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="104" font-weight="700" letter-spacing="-2">pkg</text>
  <text x="88" y="238" fill="#c5beae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Familiar package commands on top of Nix.</text>

  <!-- Terminal -->
  <g transform="translate(792 52)">
    <rect width="400" height="216" rx="12" fill="#151b25" stroke="#2a3344"/>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
      <text x="28" y="46"><tspan fill="#54a99c">$</tspan><tspan fill="#ece5d6"> pkg install rg</tspan></text>
      <text x="28" y="78" fill="#8f8a7c">Resolving: rg</text>
      <text x="28" y="104" fill="#8f8a7c">ripgrep provides the `rg` command.</text>
      <text x="28" y="130" fill="#8f8a7c">Installing: ripgrep</text>
      <text x="28" y="160" fill="#ece5d6">Installed ripgrep 15.2.0</text>
      <text x="28" y="186" fill="#c5beae">Commands: rg</text>
    </g>
  </g>
</svg>
