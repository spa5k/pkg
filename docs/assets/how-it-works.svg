<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532" viewBox="0 0 1000 532" role="img" aria-labelledby="title desc">
  <title id="title">How pkg uses Nix</title>
  <desc id="desc">Packages from Nixpkgs, Homebrew Casks, Homebrew Formulae, public taps, and GitHub flakes go through pkg. pkg finds the package, checks the request, locks the profile, runs nix profile, and reports the result. Nix downloads or builds the package, checks hashes and signatures, and keeps it in the Nix store. Each change adds a generation to the pkg profile, and pkg rollback returns to an earlier generation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a566b"/>
    </marker>
  </defs>
  <rect width="1000" height="532" rx="16" fill="#0f131a"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Column labels -->
    <g font-size="12" font-weight="600" letter-spacing="1.4" fill="#8f8a7c">
      <text x="32" y="60">SOURCES</text>
      <text x="372" y="60">CLIENT</text>
      <text x="682" y="60">NIX</text>
    </g>

    <!-- Sources -->
    <g>
      <rect x="32" y="80" width="290" height="80" rx="10" fill="#151b25" stroke="#2a3344"/>
      <text x="54" y="113" font-size="17" font-weight="600" fill="#ece5d6">Nixpkgs</text>
      <text x="54" y="140" font-size="14" fill="#c5beae">The main Nix package set</text>

      <rect x="32" y="172" width="290" height="80" rx="10" fill="#151b25" stroke="#2a3344"/>
      <text x="54" y="205" font-size="17" font-weight="600" fill="#ece5d6">Homebrew Casks</text>
      <text x="54" y="232" font-size="14" fill="#c5beae">Signed Homebrew data, built by Nix</text>

      <rect x="32" y="264" width="290" height="80" rx="10" fill="#151b25" stroke="#2a3344"/>
      <text x="54" y="297" font-size="17" font-weight="600" fill="#ece5d6">Homebrew Formulae</text>
      <text x="54" y="324" font-size="14" fill="#c5beae">A Nixpkgs match or a Core bottle</text>

      <rect x="32" y="356" width="290" height="80" rx="10" fill="#151b25" stroke="#2a3344"/>
      <text x="54" y="389" font-size="17" font-weight="600" fill="#ece5d6">Public taps and flakes</text>
      <text x="54" y="416" font-size="14" fill="#c5beae">Only after you approve them</text>
    </g>

    <!-- Arrows into pkg -->
    <g stroke="#4a566b" stroke-width="2" marker-end="url(#arrow)">
      <line x1="322" y1="120" x2="368" y2="120"/>
      <line x1="322" y1="212" x2="368" y2="212"/>
      <line x1="322" y1="304" x2="368" y2="304"/>
      <line x1="322" y1="396" x2="368" y2="396"/>
    </g>

    <!-- pkg -->
    <rect x="372" y="80" width="260" height="356" rx="10" fill="#151b25" stroke="#3c8478"/>
    <text x="396" y="126" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#ece5d6">pkg</text>
    <text x="396" y="152" font-size="14" fill="#8f8a7c">The command that you run</text>
    <line x1="406" y1="196" x2="406" y2="396" stroke="#54a99c" stroke-width="3"/>
    <g fill="#151b25" stroke="#54a99c" stroke-width="3">
      <circle cx="406" cy="196" r="7"/>
      <circle cx="406" cy="246" r="7"/>
      <circle cx="406" cy="296" r="7"/>
      <circle cx="406" cy="346" r="7"/>
      <circle cx="406" cy="396" r="7" fill="#54a99c"/>
    </g>
    <g font-size="16" fill="#ece5d6">
      <text x="428" y="201">Find the package</text>
      <text x="428" y="251">Check the request</text>
      <text x="428" y="301">Lock the profile</text>
      <text x="428" y="351">Run nix profile</text>
      <text x="428" y="401">Report the result</text>
    </g>

    <!-- pkg to Nix -->
    <line x1="632" y1="158" x2="678" y2="158" stroke="#4a566b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Nix -->
    <rect x="682" y="80" width="286" height="156" rx="10" fill="#151b25" stroke="#2a3344"/>
    <text x="706" y="120" font-size="20" font-weight="600" fill="#ece5d6">Nix</text>
    <g font-size="14.5" fill="#c5beae">
      <text x="706" y="152">Downloads or builds the package</text>
      <text x="706" y="178">Checks hashes and signatures</text>
      <text x="706" y="204">Keeps it in /nix/store</text>
    </g>

    <!-- Nix to profile -->
    <line x1="825" y1="236" x2="825" y2="264" stroke="#4a566b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Profile and generations -->
    <rect x="682" y="268" width="286" height="168" rx="10" fill="#151b25" stroke="#2a3344"/>
    <text x="706" y="306" font-size="20" font-weight="600" fill="#ece5d6">Your pkg profile</text>
    <text x="706" y="330" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8f8a7c">~/.local/state/nix/profiles/pkg</text>
    <path d="M918 380 C 904 356, 860 356, 846 376" fill="none" stroke="#54a99c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="882" y="351" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#54a99c">pkg rollback</text>
    <line x1="740" y1="390" x2="930" y2="390" stroke="#364154" stroke-width="3"/>
    <g stroke-width="3">
      <circle cx="740" cy="390" r="7" fill="#151b25" stroke="#364154"/>
      <circle cx="836" cy="390" r="7" fill="#151b25" stroke="#54a99c"/>
      <circle cx="930" cy="390" r="7" fill="#54a99c" stroke="#54a99c"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8f8a7c" text-anchor="middle">
      <text x="740" y="420">gen 1</text>
      <text x="836" y="420">gen 2</text>
      <text x="930" y="420" fill="#c5beae">gen 3</text>
    </g>

    <!-- Footer -->
    <line x1="32" y1="460" x2="968" y2="460" stroke="#232c3b"/>
    <g font-size="14.5" fill="#8f8a7c">
      <text x="32" y="488">Your default Nix profile does not change. pkg changes Nix settings only after you approve the tap sandbox setup.</text>
      <text x="32" y="512">On macOS, apps appear in ~/Applications/pkg/ after a signature check.</text>
    </g>
  </g>
</svg>
