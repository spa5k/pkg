# clippy configuration for the `pkg` workspace.
#
# The MSRV is pinned here, kept consistent with [workspace.package]
# rust-version = "1.96" and the exact repo toolchain (rust-toolchain.toml
# channel "1.96.1").
#
# The strict complexity budgets from ADR 0005 (50 lines, 5 arguments, 10
# cognitive, 150 type complexity) are NOT configured here: once configured,
# these thresholds fire at deny level inside the crates that already deny
# clippy::pedantic, breaking every historical violation at once. The budgets
# are applied by the G-QUALITY gate instead — tools/quality/quality-gate.sh
# swaps in a strict config for the check and restores this one afterwards.

msrv = "1.96"
